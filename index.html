<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nhúng CSS vào HTML</title>

    <!-- Phần 2: Internal CSS -->
    <style>
      .internal {
        color: blue;
      }
    </style>

    <!-- Phần 3: External CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Phần 1: Inline CSS -->
    <h1 style="color: red">Phần 1 - Inline CSS</h1>

    <p style="color: red">Đây là đoạn văn được định dạng bằng Inline CSS.</p>

    <!-- Phần 2: Internal CSS -->
    <h1 class="internal">Phần 2 - Internal CSS</h1>

    <p class="internal">Đây là đoạn văn được định dạng bằng Internal CSS.</p>

    <!-- Phần 3: External CSS -->
    <h1 class="external">Phần 3 - External CSS</h1>

    <p class="external">Đây là đoạn văn được định dạng bằng External CSS.</p>
  </body>
</html>
